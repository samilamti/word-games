<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1a0d2e" />
      <stop offset="100%" stop-color="#05030c" />
    </radialGradient>

    <linearGradient id="tileGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff4c8" />
      <stop offset="45%" stop-color="#ffd76a" />
      <stop offset="100%" stop-color="#e89313" />
    </linearGradient>

    <linearGradient id="tileBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.55)" />
      <stop offset="40%" stop-color="rgba(255,255,255,0)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.35)" />
    </linearGradient>

    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="32" />
      <feOffset dx="0" dy="36" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.45" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="2732" height="2732" fill="#0d0d1a" />
  <rect width="2732" height="2732" fill="url(#bg)" />

  <!-- Centered tile -->
  <g transform="translate(1366,1366) rotate(-6)" filter="url(#tileShadow)">
    <rect x="-340" y="-340" width="680" height="680" rx="76" ry="76"
          fill="url(#tileGold)" stroke="#7a4a18" stroke-width="16" />
    <rect x="-330" y="-330" width="660" height="660" rx="68" ry="68"
          fill="url(#tileBevel)" />
    <text x="0" y="170" font-family="Georgia, 'Times New Roman', serif"
          font-size="700" font-weight="bold" text-anchor="middle"
          fill="#1a1024">L</text>
    <text x="265" y="290" font-family="Georgia, serif"
          font-size="100" font-weight="bold" text-anchor="middle"
          fill="#3a2010">1</text>
  </g>
</svg>
